services:
  postgres:
    image: postgres:17-alpine
    container_name: servic-waha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_waha
      POSTGRES_USER: service_waha
      POSTGRES_PASSWORD: change-me-in-production
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: servic-waha-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass change-me-in-production
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
