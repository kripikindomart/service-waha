<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Waha Gateway</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1020; color: #e8edf7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(960px, calc(100% - 32px)); }
    .card { background: #151d32; border: 1px solid #293653; border-radius: 16px; padding: 24px; box-shadow: 0 20px 60px #0005; }
    h1 { margin-top: 0; } input, button { border-radius: 9px; border: 1px solid #354564; padding: 11px 12px; font: inherit; }
    input { background: #0e1628; color: inherit; width: 100%; box-sizing: border-box; margin: 6px 0 12px; }
    button { background: #4f7cff; color: white; cursor: pointer; } button.secondary { background: #263452; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .muted { color: #91a0ba; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; } th, td { text-align: left; border-bottom: 1px solid #293653; padding: 12px 8px; }
    #app { display: none; } #message { min-height: 24px; margin: 12px 0; color: #8ed1ff; }
  </style>
</head>
<body>
<main>
  <section id="login" class="card">
    <h1>Service Waha</h1><p class="muted">Gateway WhatsApp</p>
    <form id="loginForm"><label>Username<input id="username" value="admin" required /></label><label>Password<input id="password" type="password" required /></label><button>Login</button></form>
  </section>
  <section id="app" class="card">
    <div class="row"><div><h1>WhatsApp Gateway</h1><p class="muted">Kelola session WAHA dari satu tempat.</p></div><button id="logout" class="secondary">Logout</button></div>
    <div id="message"></div>
    <form id="newSession" class="row"><input id="sessionName" placeholder="Nama session, contoh: toko-utama" required /><button>Buat session</button><button type="button" id="refresh" class="secondary">Refresh</button></form>
    <table><thead><tr><th>Session</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="sessions"></tbody></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const message = (text) => $('message').textContent = text || '';
async function api(path, options = {}) { const response = await fetch(path, { ...options, headers: {'Content-Type': 'application/json', ...(options.headers || {})} }); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || data.message || `HTTP ${response.status}`); return data; }
async function load() { const sessions = await api('/v1/sessions'); $('sessions').innerHTML = (Array.isArray(sessions) ? sessions : []).map((s) => `<tr><td>${s.name || '-'}</td><td>${s.status || '-'}</td><td><button onclick="startSession('${encodeURIComponent(s.name)}')">Start</button> <button class="secondary" onclick="stopSession('${encodeURIComponent(s.name)}')">Stop</button></td></tr>`).join('') || '<tr><td colspan="3" class="muted">Belum ada session.</td></tr>'; }
async function startSession(name) { try { await api(`/v1/sessions/${name}/start`, {method:'POST'}); message('Session dimulai. Scan QR dari dashboard WAHA bila diperlukan.'); await load(); } catch (e) { message(e.message); } }
async function stopSession(name) { try { await api(`/v1/sessions/${name}/stop`, {method:'POST'}); await load(); } catch (e) { message(e.message); } }
$('loginForm').onsubmit = async (e) => { e.preventDefault(); try { await api('/auth/login', {method:'POST', body: JSON.stringify({username:$('username').value, password:$('password').value})}); $('login').style.display='none'; $('app').style.display='block'; await load(); } catch (e) { alert('Login gagal'); } };
$('newSession').onsubmit = async (e) => { e.preventDefault(); try { await api('/v1/sessions', {method:'POST', body: JSON.stringify({name:$('sessionName').value})}); $('sessionName').value=''; message('Session berhasil dibuat.'); await load(); } catch (e) { message(e.message); } };
$('refresh').onclick = load; $('logout').onclick = async () => { await api('/auth/logout', {method:'POST'}); location.reload(); };
api('/auth/me').then(() => { $('login').style.display='none'; $('app').style.display='block'; load(); }).catch(() => {});
</script>
</body>
</html>
